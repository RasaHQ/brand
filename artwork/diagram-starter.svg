<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Illustrative skills flow</title><desc id="desc">One agent routes to three skills; the rebook skill is the focus. Editable starter that follows the Rasa Brand 2026 visual layer: Taupe 50 cards, 1px Taupe 300 borders, radius 16, orthogonal 1.5px connectors, one pink focus.</desc><rect width="1200" height="800" fill="#FAF6F0"/><text x="64" y="75" fill="#524A43" font-family="'STK Bureau Sans Mono','JetBrains Mono',monospace" font-size="18">SKILLS</text><text x="64" y="148" fill="#181210" font-family="'STK Bureau Serif','Newsreader',Georgia,serif" font-weight="300" font-size="48">Each skill owns one task.</text><rect x="64" y="200" width="1072" height="540" rx="32" fill="#F3EEE7"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#524A43" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#E85A91" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g fill="none" stroke-width="1.5"><path d="M376 470 H430 Q442 470 442 458 V322 Q442 310 454 310 H558" stroke="#524A43" marker-end="url(#a)"/><path d="M376 470 H558" stroke="#E85A91" marker-end="url(#f)"/><path d="M376 470 H430 Q442 470 442 482 V618 Q442 630 454 630 H558" stroke="#524A43" marker-end="url(#a)"/></g><rect x="96" y="420" width="280" height="100" rx="16" fill="#181210"/><text x="128" y="478" fill="#FAF6F0" font-family="'STK Bureau Sans','Inter',Arial,sans-serif" font-weight="500" font-size="20">Booking agent</text><g><rect x="560" y="270" width="540" height="80" rx="16" fill="#FFFBF5" stroke="#C8C0B6" stroke-width="1"/><text x="592" y="306" fill="#181210" font-family="'STK Bureau Sans','Inter',Arial,sans-serif" font-weight="500" font-size="20">Check booking</text><text x="592" y="330" fill="#524A43" font-family="'STK Bureau Sans Mono','JetBrains Mono',monospace" font-size="16">check_booking</text></g><g><rect x="560" y="430" width="540" height="80" rx="16" fill="#FFFBF5" stroke="#E85A91" stroke-width="1.5"/><text x="592" y="466" fill="#181210" font-family="'STK Bureau Sans','Inter',Arial,sans-serif" font-weight="500" font-size="20">Rebook flight</text><text x="592" y="490" fill="#524A43" font-family="'STK Bureau Sans Mono','JetBrains Mono',monospace" font-size="16">rebook_flight</text><rect x="964" y="454" width="112" height="32" rx="8" fill="#FCE7EF"/><text x="1020" y="475" text-anchor="middle" fill="#AA1E54" font-family="'STK Bureau Sans','Inter',Arial,sans-serif" font-weight="500" font-size="14" letter-spacing="0.56">FOCUS</text></g><g><rect x="560" y="590" width="540" height="80" rx="16" fill="#FFFBF5" stroke="#C8C0B6" stroke-width="1"/><text x="592" y="626" fill="#181210" font-family="'STK Bureau Sans','Inter',Arial,sans-serif" font-weight="500" font-size="20">Hand off to a person</text><text x="592" y="650" fill="#524A43" font-family="'STK Bureau Sans Mono','JetBrains Mono',monospace" font-size="16">handoff</text></g><text x="64" y="775" fill="#524A43" font-family="'STK Bureau Sans','Inter',Arial,sans-serif" font-size="16">Illustrative starter. Text is set in the brand stacks; replace with real names from the source material.</text></svg>